<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xeon 체스 - 방</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 관리자 전용 숨은 클릭 영역 (오른쪽 상단 모서리) -->
<div id="adminCorner" class="admin-corner" title=""></div>

<!-- 대기(준비) 화면 -->
<div id="waitingPhase" class="waiting-wrap">
  <h1 id="roomTitle" class="room-title"></h1>
  <p id="roomRuleSummary" class="room-rule-summary"></p>
  <p id="waitingStatus" class="waiting-status"></p>

  <!-- 왼쪽=방장, 가운데=준비 버튼, 오른쪽=도전자 -->
  <div class="ready-row">
    <div class="ready-player ready-player-left">
      <span id="waitingHostName" class="ready-player-name">방장</span>
      <span id="waitingHostCheck" class="ready-check" style="display:none;">✔</span>
    </div>

    <button id="readyBtn" class="btn primary ready-center-btn">준비</button>

    <div class="ready-player ready-player-right">
      <span id="waitingChallengerName" class="ready-player-name">도전자</span>
      <span id="waitingChallengerCheck" class="ready-check" style="display:none;">✔</span>
    </div>
  </div>

  <button id="leaveWaitingBtn" class="btn leave-waiting-btn">나가기</button>
</div>

<!-- 게임 화면 -->
<div id="gamePhase" class="game-wrap" style="display:none;">
  <div class="game-layout">

    <div class="left-col">
      <button id="resignBtn" class="btn resign-btn">기권</button>
      <button id="adminDeleteBtn" class="btn admin-delete-btn" style="display:none;">방 삭제(관리자)</button>
    </div>

    <div class="board-col">
      <!-- 왼쪽=방장, 오른쪽=도전자 (보는 사람과 무관하게 항상 동일한 배치) -->
      <div class="player-row">
        <div class="player-block player-block-left">
          <span id="hostName" class="player-name">방장</span>
          <span id="hostTime" class="player-time"></span>
        </div>
        <div class="player-block player-block-right">
          <span id="challengerName" class="player-name">도전자</span>
          <span id="challengerTime" class="player-time"></span>
        </div>
      </div>

      <div id="board" class="chess-board"></div>

      <p id="gameStatus" class="game-status"></p>
    </div>

    <div class="right-col">
      <div id="logPanel" class="log-panel"></div>
      <div class="history-nav">
        <button id="prevBtn" class="btn nav-btn">◀ 이전</button>
        <button id="nextBtn" class="btn nav-btn">다음 ▶</button>
      </div>
      <button id="latestBtn" class="btn full-width-btn">최신 수로 이동</button>
      <button id="undoRequestBtn" class="btn full-width-btn" disabled title="다음 단계에서 구현 예정">
        무르기 요청
      </button>
    </div>

  </div>
</div>

<script type="module" src="js/room.js"></script>
</body>
</html>
