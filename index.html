<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xeon 체스 - 로비</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 관리자 전용 숨은 클릭 영역 (오른쪽 상단 모서리) -->
<div id="adminCorner" class="admin-corner" title=""></div>

<div class="lobby-wrap">
  <header class="lobby-header">
    <h1>체스 로비</h1>
    <button id="createRoomBtn" class="btn primary">방 생성</button>
  </header>

  <ul id="roomList" class="room-list">
    <!-- JS가 채웁니다 -->
  </ul>
  <p id="emptyMsg" class="empty-msg" style="display:none;">개설된 방이 없어요. 방을 만들어보세요.</p>
</div>

<!-- 방 생성 모달 -->
<div id="createModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>방 만들기</h2>

    <label>방 이름</label>
    <input id="roomNameInput" type="text" maxlength="20" placeholder="예: 즐겜방">

    <label>비밀번호 (비워두면 누구나 입장)</label>
    <input id="roomPasswordInput" type="password" maxlength="20" placeholder="선택 사항">

    <label>선공 결정 방식</label>
    <select id="firstMoveRuleInput">
      <option value="random">무작위</option>
      <option value="host">방장 선</option>
      <option value="challenger">도전자 선</option>
    </select>

    <label>무르기 허용 횟수 (각자 기준)</label>
    <select id="undoLimitInput">
      <option value="0">0회 (사용 안 함)</option>
      <option value="1">1회</option>
      <option value="2">2회</option>
      <option value="3">3회</option>
      <option value="-1">무제한</option>
    </select>

    <label>시간 설정</label>
    <select id="timePresetInput">
      <option value="unlimited">무제한</option>
      <option value="60">1분 (불릿)</option>
      <option value="180">3분 (블리츠)</option>
      <option value="600">10분 (래피드)</option>
      <option value="custom">직접 입력</option>
    </select>

    <div id="customTimeGroup" style="display:none;">
      <label>기본 시간(분)</label>
      <input id="customMinInput" type="number" min="1" value="5">
    </div>

    <label>턴당 추가시간(초)</label>
    <input id="incrementSecInput" type="number" min="0" value="0">

    <div class="modal-actions">
      <button id="cancelCreateBtn" class="btn">취소</button>
      <button id="confirmCreateBtn" class="btn primary">생성하고 입장</button>
    </div>
    <p id="createError" class="error-msg"></p>
  </div>
</div>

<!-- 비밀번호 입력 모달 -->
<div id="passwordModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2 id="passwordModalTitle">비밀번호 입력</h2>
    <input id="joinPasswordInput" type="password" maxlength="20" placeholder="비밀번호">
    <div class="modal-actions">
      <button id="cancelJoinBtn" class="btn">취소</button>
      <button id="confirmJoinBtn" class="btn primary">입장</button>
    </div>
    <p id="joinError" class="error-msg"></p>
  </div>
</div>

<script type="module" src="js/lobby.js"></script>
</body>
</html>
